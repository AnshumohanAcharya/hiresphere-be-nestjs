version: '3.8'

services:
  # --- Database ---
  postgres:
    image: postgres:15
    container_name: hire-sphere-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hire_sphere}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Cache & Task Queue ---
  redis:
    image: redis:7-alpine
    container_name: hire-sphere-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- DB UI Manager ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: hire-sphere-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hiresphere.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  postgres_data: